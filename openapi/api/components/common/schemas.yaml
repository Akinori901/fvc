components:
  schemas:
    # -------------------------------------------------------------------------- *
    # 共通レスポンスフィールド
    # -------------------------------------------------------------------------- *
    PaginationMeta:
      type: object
      properties:
        count:
          type: integer
          example: 150
          description: 総件数
        page:
          type: integer
          example: 1
          description: 現在のページ番号
        page_size:
          type: integer
          example: 20
          description: 1ページあたりの件数
        total_pages:
          type: integer
          example: 8
          description: 総ページ数
      required:
        - count
        - page
        - page_size
        - total_pages

    # -------------------------------------------------------------------------- *
    # 日付・時刻
    # -------------------------------------------------------------------------- *
    DateField:
      type: string
      format: date
      example: "2026-02-25"

    DateTimeField:
      type: string
      format: date-time
      example: "2026-02-25T10:00:00+09:00"

    # -------------------------------------------------------------------------- *
    # 銘柄関連
    # -------------------------------------------------------------------------- *
    # （エンドポイント実装時に追加）

    # -------------------------------------------------------------------------- *
    # バリュエーション関連
    # -------------------------------------------------------------------------- *
    # （エンドポイント実装時に追加）
