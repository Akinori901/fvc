services:
  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend/Dockerfile
    container_name: fvc-backend
    ports:
      - "18000:8000"
    volumes:
      - ./backend:/app
      - ./openapi:/openapi:ro  # MCP の OpenAPI YAML 読み込み用
      - ./scripts:/scripts:ro  # 検証スクリプト（verify_mcp.py 等）
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.development
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend/Dockerfile
    container_name: fvc-frontend
    ports:
      - "8888:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped

  db:
    build:
      context: ./docker/mysql
      dockerfile: Dockerfile
    container_name: fvc-db
    ports:
      - "13306:3306"
    env_file:
      - .env
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: fvc-phpmyadmin
    ports:
      - "18080:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: ${MYSQL_USER}
      PMA_PASSWORD: ${MYSQL_PASSWORD}
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  swagger:
    image: swaggerapi/swagger-ui:latest
    container_name: fvc-swagger
    ports:
      - "18081:8080"
    volumes:
      - ./openapi:/openapi
    environment:
      SWAGGER_JSON: /openapi/api/index.yaml
    restart: unless-stopped

volumes:
  mysql_data:
  frontend_node_modules:
